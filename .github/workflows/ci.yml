name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela runs antiguos del mismo ref al empujar nuevos commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Self-hosted via CI_RUNNER se retiró porque los runners estaban offline.
    # Reintroducir solo cuando exista un runner etiquetado y saludable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # La versión de pnpm se toma de "packageManager" en package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Cobertura (umbrales)
        run: pnpm --filter @landing/web test:coverage

      - name: Build
        run: pnpm build

  e2e:
    # Self-hosted via CI_RUNNER se retiró porque los runners estaban offline.
    # Reintroducir solo cuando exista un runner etiquetado y saludable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Instalar navegador de Playwright
        run: pnpm --filter @landing/web exec playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: pnpm --filter @landing/web test:e2e
